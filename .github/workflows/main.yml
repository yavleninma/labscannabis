name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check SEO
        run: npm run check:seo

      # Сверяет вывод linkLabelKey() со словарями всех семи локалей. Без него
      # ошибка в ключе проявляется как непонятное падение про страницу-сироту,
      # а не как сообщение про отсутствующий ключ.
      - name: Check strain link labels
        run: npm run check:strains

      # Отчёт завода в лог сборки: в истории CI видно, кого и почему ворота
      # отклонили в каждом коммите. Без --strict — инструмент отвечает на
      # вопрос «почему моя страница noindex», а блокирует сборку check:seo.
      - name: Content factory report
        run: npm run check:factory

      - name: Verify clean worktree
        run: git diff --exit-code
