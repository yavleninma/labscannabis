# Оповещение поисковиков после успешного деплоя.
#
# Два независимых канала, потому что поисковики не общие:
#   - IndexNow (`scripts/ping-indexnow.mjs`) — Bing, Яндекс, Naver, Seznam, Yep.
#     Работает всегда, ключ лежит в `public/<key>.txt`.
#   - Search Console API (`scripts/gsc-submit.mjs`) — ТОЛЬКО Google, который в
#     IndexNow не участвует. Включается сам в тот день, когда владелец положит
#     ключ сервисного аккаунта в секрет GSC_SERVICE_ACCOUNT_JSON; пока секрета
#     нет, шаг честно печатает «не настроен» и выходит нулём.
#     Инструкция: docs/growth/ops/04-search-console-api.md
#
# Почему отдельный workflow, а не шаг в main.yml: main.yml ничего не деплоит —
# он делает checkout, npm ci, build, check:seo и git diff. Деплоит Vercel через
# Git-интеграцию, и единственный момент, когда «новая версия уже доступна по
# URL», — это deployment_status со state=success. Вставить пинг в main.yml
# означало бы звать поисковики на страницы, которых ещё нет.
#
# Участники IndexNow: Bing, Яндекс, Naver, Seznam, Yep. Google протокол НЕ
# поддерживает — этот workflow не ускоряет индексацию в Google и не заменяет
# Search Console.
name: Notify search engines

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только напечатать список URL, ничего не отправлять"
        type: boolean
        default: false

permissions:
  contents: read

# Пинги не должны обгонять друг друга: при двух деплоях подряд поисковику
# полезнее один запрос с актуальным списком, чем гонка двух.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    # deployment_status приходит на каждое изменение статуса, включая pending,
    # error и preview-деплои веток. Пингуем только успешный production.
    # Сравнение строк в выражениях GitHub Actions регистронезависимо, поэтому
    # 'Production' матчит и 'production'. Второй признак — булев флаг самого
    # деплоя: если Vercel когда-нибудь переименует окружение, условие не
    # развалится молча (а молча — это здесь единственный опасный режим:
    # workflow просто перестанет запускаться, и заметить это нечем).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment_status.environment == 'Production' ||
        github.event.deployment.production_environment))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Сайтмапа нет в репозитории: он появляется только после сборки, и список
      # URL скрипт берёт именно из него, а не из захардкоженного массива.
      - name: Build
        run: npm run build

      # Видно в логе, что именно приехало: без этой строки «workflow не
      # запускается» отлаживается только гаданием.
      - name: Show trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "state=${{ github.event.deployment_status.state }}"
          echo "environment=${{ github.event.deployment_status.environment }}"
          echo "production=${{ github.event.deployment.production_environment }}"
          echo "url=${{ github.event.deployment_status.environment_url }}"

      - name: Ping IndexNow (Bing, Yandex, Naver, Seznam, Yep)
        run: node scripts/ping-indexnow.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # Google. Без секрета шаг печатает «не настроен» и выходит нулём —
      # добавлять его сюда позже не придётся, достаточно завести секрет.
      # `--soft` — чтобы истёкший ключ или лежащий API красил лог жёлтым, а не
      # ронял workflow: деплой уже выложен, и переобход придёт своим чередом.
      - name: Submit sitemap to Google Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        run: node scripts/gsc-submit.mjs --soft ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
